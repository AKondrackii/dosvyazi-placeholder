services:
  placeholder_vite:
    build: .
    container_name: placeholder_vite
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev

volumes:
  node_modules: